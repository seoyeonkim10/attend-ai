<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTENDO DEMO</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#172033;background:#fff}header{border-bottom:1px solid #e6eaf1;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:22px}small,p{color:#64748b;line-height:1.6}main{max-width:900px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;border:1px solid #dce1eb;border-radius:10px;padding:12px;max-width:100%}button{cursor:pointer;background:#eef1ff;color:#354fc9;font-weight:600}button.primary{background:#4968e8;color:white}button:disabled{opacity:.5}section{margin:24px 0;border-bottom:1px solid #e6eaf1;padding-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:20px;text-align:left;background:#f4f5ff}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #dce1eb;border-radius:14px;padding:14px;text-align:center;gap:5px}.stats b{display:block;font-size:25px}.line{padding:14px 0;border-bottom:1px solid #e6eaf1;overflow-wrap:anywhere}.form{display:grid;gap:12px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.day{padding:8px 0;border:1px solid #e6eaf1;border-radius:8px;font-size:12px;min-height:50px}.day small{display:block;font-size:10px}.notice{background:#f3f5ff;padding:14px;border-radius:12px}h1{font-size:28px}h2{font-size:20px}nav{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:480px){main{padding:16px}.tile{padding:12px}.stats b{font-size:20px}.stats small{font-size:11px}}
</style><header><strong>ATTENDO</strong><small>SMART ATTENDANCE · DEMO</small><button id="home">모드 선택</button><button id="reset">초기화</button></header><main><p class="notice">체험 전용 · 가상 데이터만 사용합니다. 실제 개인정보를 입력하지 마세요.</p><nav id="nav"></nav><div id="view"></div><p id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id),today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date()),statuses=['출석','인정 지각','미인정 지각','인정 결석','미인정 결석'],key='attendo-demo-v1';
const seed=()=>({students:[{id:'DEMO001',name:'가상학생 01',active:true},{id:'DEMO002',name:'가상학생 02',active:true},{id:'DEMO003',name:'가상학생 03',active:true}],records:[{id:'DEMO001',date:today().slice(0,8)+'05',status:'출석',time:'08:15'},{id:'DEMO001',date:today().slice(0,8)+'06',status:'미인정 지각',time:'08:30'}],requests:[],rules:['08:25','08:25','12:55','08:25','08:25'],devices:[{name:'가상 학교 입구 기기',active:true}],classes:['체험 1반'],audit:[]});
let db;try{db=JSON.parse(localStorage.getItem(key))||seed()}catch{db=seed()}let mode='home',page='',month=today().slice(0,7);const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch{}},esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(label,action)=>'<button data-action="'+action+'">'+label+'</button>',name=id=>db.students.find(s=>s.id===id)?.name||id;
const menus={student:['대시보드','월별 출결 기록','사유 신청','출결 정정 요청','설정 및 안내'],teacher:['출결 관리','신청 관리','학급 관리','변경 이력'],admin:['학교 계정 관리','출결 규정','출석 기기 관리'],scan:['스캔 체험']};
function go(m,p){mode=m;page=p||menus[m]?.[0]||'';$('msg').textContent='';render()}
function records(){return db.records.filter(r=>r.id==='DEMO001'&&r.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date))}
function stats(rs){return '<div class="stats">'+['출석','지각','결석','확인 필요'].map((s,i)=>'<div><small>'+s+'</small><b style="color:'+['#16866a','#996500','#b42318','#172033'][i]+'">'+(i===3?db.requests.filter(r=>r.state==='대기').length:rs.filter(r=>r.status.includes(s)).length)+'건</b></div>').join('')+'</div>'}
function lines(rs){return rs.map(r=>'<div class="line">'+esc(r.date)+' · '+esc(r.status)+' · '+esc(r.time||'—')+'</div>').join('')||'<p>기록 없음</p>'}
function render(){ $('nav').innerHTML=(menus[mode]||[]).map((p,i)=>btn(p,'page:'+i)).join('');let h='<h1>'+esc(page)+'</h1>';if(mode==='home'){h='<h1>ATTENDO 체험하기</h1><p>회원가입 없이 원하는 역할을 선택하세요.</p><div class="grid">'+[['student','학생 모드','출결 확인 · 사유 신청'],['teacher','교사 모드','출결 관리 · 신청 승인'],['admin','관리자 모드','계정 · 규정 · 기기 관리'],['scan','출석 스캔 모드','가상 학생증 인식 체험']].map(x=>'<button class="tile" data-action="mode:'+x[0]+'"><h2>'+x[1]+'</h2><small>'+x[2]+'</small></button>').join('')+'</div>'}
else if(mode==='student'){let rs=records();if(page==='대시보드'){h='<h1>오늘도 좋은 하루예요 👋</h1><section class="notice"><h2>오늘의 출결 상태</h2><strong>'+esc(db.records.find(r=>r.id==='DEMO001'&&r.date===today())?.status||'오늘 출결 기록 없음')+'</strong></section><h2>이번 달 출결 현황</h2>'+stats(db.records.filter(r=>r.id==='DEMO001'&&r.date.startsWith(today().slice(0,7))))+'<section><nav>'+btn('월별 출결 기록','page:1')+btn('사유 신청','page:2')+'</nav></section><h2>최근 출결 기록</h2>'+lines(db.records.filter(r=>r.id==='DEMO001').sort((a,b)=>b.date.localeCompare(a.date)))}
else if(page==='월별 출결 기록'){let [y,m]=month.split('-').map(Number),offset=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();h+='<input id="month" type="month" value="'+month+'"><section>'+stats(rs)+'</section><div class="cal">'+['일','월','화','수','목','금','토'].map(x=>'<b>'+x+'</b>').join('')+'<div></div>'.repeat(offset)+Array.from({length:days},(_,i)=>'<div class="day">'+(i+1)+'<small>'+esc(rs.find(r=>r.date===month+'-'+String(i+1).padStart(2,'0'))?.status||'—')+'</small></div>').join('')+'</div><section>'+lines(rs)+'</section>'}
else if(page==='설정 및 안내'){h+='<section><h2>내 계정 정보</h2><div class="notice">가상학생 01 · DEMO001 · 체험 1반</div></section><section><h2>학교 출결 규정</h2>'+db.rules.map((t,i)=>'<div class="line">'+['월','화','수','목','금'][i]+'요일 · '+esc(t)+'까지</div>').join('')+'</section><p>데모에서는 비밀번호가 필요하지 않습니다.</p>'}
else{h+='<form id="request" class="form"><label>출결 날짜</label><input type="date" id="date" required value="'+today()+'"><label>신청 유형</label><select id="kind">'+(page==='출결 정정 요청'?'<option>출결 정정 요청</option>':'<option>지각</option><option>결석</option>')+'</select><textarea id="reason" required minlength="3" maxlength="200" placeholder="가상 사유 입력"></textarea><button class="primary">신청 제출</button></form><section><h2>내 신청 내역</h2>'+db.requests.map(r=>'<div class="line">'+esc(r.date+' · '+r.kind+' · '+r.state+' · '+r.reason)+'</div>').join('')+'</section>'}}
else if(mode==='teacher'){if(page==='출결 관리'){h+=db.students.map(s=>'<section><h2>'+esc(s.name)+'</h2>'+db.records.map((r,i)=>r.id===s.id?'<div class="line">'+esc(r.date)+' <select data-record="'+i+'">'+statuses.map(t=>'<option '+(t===r.status?'selected':'')+'>'+t+'</option>').join('')+'</select></div>':'').join('')+'</section>').join('')}
else if(page==='신청 관리'){h+=db.requests.map((r,i)=>'<div class="line">'+esc(r.date+' · '+r.kind+' · '+r.reason+' · '+r.state)+'<nav>'+(r.state==='대기'?btn('승인','approve:'+i)+btn('반려','reject:'+i):'')+'</nav></div>').join('')||'<p>신청 없음</p>'}
else if(page==='학급 관리'){h+=db.classes.map(c=>'<div class="line">'+esc(c)+'</div>').join('')+'<form id="class" class="form"><input id="className" required maxlength="40" placeholder="가상 학급 이름"><button>학급 추가</button></form>'}
else h+=db.audit.map(a=>'<div class="line">'+esc(a)+'</div>').join('')||'<p>변경 이력 없음</p>'}
else if(mode==='admin'){if(page==='학교 계정 관리'){h+=db.students.map((s,i)=>'<div class="line">'+esc(s.name+' · '+s.id+' · '+(s.active?'활성':'비활성'))+' '+btn(s.active?'비활성화':'활성화','student:'+i)+'</div>').join('')+'<form id="account" class="form"><input id="accountName" required maxlength="40" placeholder="가상 학생 이름"><button>계정 추가</button></form>'}
else if(page==='출결 규정'){h+='<form id="rules" class="form">'+db.rules.map((t,i)=>'<label>'+['월','화','수','목','금'][i]+'요일 <input type="time" required id="rule'+i+'" value="'+esc(t)+'"></label>').join('')+'<button class="primary">규정 저장</button></form>'}
else h+=db.devices.map((d,i)=>'<div class="line">'+esc(d.name+' · '+(d.active?'활성':'비활성'))+' '+btn(d.active?'비활성화':'활성화','device:'+i)+'</div>').join('')+'<form id="device" class="form"><input id="deviceName" required maxlength="40" placeholder="가상 기기 이름"><button>기기 등록</button></form>'}
else{h+='<p>카메라 없이 가상 학생증 스캔을 시뮬레이션합니다.</p><form id="scan" class="form"><select id="barcode">'+db.students.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.id+' · '+s.name)+'</option>').join('')+'</select><button class="primary">가상 학생증 스캔</button></form><section><h2>오늘의 스캔 기록</h2>'+db.records.filter(r=>r.date===today()).map(r=>'<div class="line">'+esc(name(r.id)+' · '+r.status+' · '+r.time)+'</div>').join('')+'</section>'}
$('view').innerHTML=h}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;const [k,v]=a.split(':');if(k==='mode')return go(v);if(k==='page')return go(mode,menus[mode][+v]);if(k==='approve'||k==='reject'){db.requests[v].state=k==='approve'?'승인':'반려'}if(k==='student')db.students[v].active=!db.students[v].active;if(k==='device')db.devices[v].active=!db.devices[v].active;save();render()});
document.addEventListener('change',e=>{if(e.target.id==='month'){if(e.target.value){month=e.target.value;render()}}if(e.target.dataset.record!==undefined){let r=db.records[e.target.dataset.record],old=r.status,why=prompt('가상 변경 사유를 입력하세요');if(!why?.trim()){render();return}r.status=e.target.value;db.audit.push(name(r.id)+' · '+r.date+' · '+old+' → '+r.status+' · '+why);save();render()}});
document.addEventListener('submit',e=>{e.preventDefault();let id=e.target.id,msg='저장되었습니다.';if(id==='request')db.requests.push({date:$('date').value,kind:$('kind').value,reason:$('reason').value,state:'대기'});if(id==='class')db.classes.push($('className').value);if(id==='account')db.students.push({id:'DEMO'+String(db.students.length+1).padStart(3,'0'),name:$('accountName').value,active:true});if(id==='rules')db.rules=db.rules.map((_,i)=>$('rule'+i).value);if(id==='device')db.devices.push({name:$('deviceName').value,active:true});if(id==='scan'){let s=db.students.find(s=>s.id===$('barcode').value),d=today(),weekday=new Date(d+'T12:00:00+09:00').getUTCDay(),time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());if(!s?.active||!db.devices.some(d=>d.active))msg='활성 학생 또는 기기를 확인하세요.';else if(!weekday||weekday===6)msg='주말에는 출결을 기록하지 않습니다.';else if(db.records.some(r=>r.id===s.id&&r.date===d))msg='이미 출결 기록이 있습니다.';else{db.records.push({id:s.id,date:d,time,status:time<=db.rules[weekday-1]?'출석':'미인정 지각'});msg='가상 출결이 기록되었습니다.'}}save();render();$('msg').textContent=msg});
$('home').onclick=()=>go('home');$('reset').onclick=()=>{if(confirm('체험 데이터를 초기화할까요?')){db=seed();save();go('home')}};render();
</script></html>
