<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTENDO | 출결 스캔</title><style>*{box-sizing:border-box}body{background:#f5f7fb;color:#172033;font:16px system-ui;margin:0}main{max-width:680px;margin:30px auto;padding:20px}section{background:white;border:1px solid #e6eaf1;border-radius:18px;padding:22px;margin:16px 0}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #dfe5ef;margin:6px 0;max-width:100%}label{display:block}button{background:#4968e8;color:white;cursor:pointer}button:disabled{opacity:.5}#reader{width:100%}p{line-height:1.6}small{color:#607089}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main><h1>ATTENDO · 출결 스캔</h1><p>관리자 감독하의 시연용 · 테스트 계정만 사용</p><section id="login"><form id="loginForm"><label>이메일 <input id="email" type="email" required></label><label>비밀번호 <input id="password" type="password" required></label><button>관리자 로그인</button></form></section><section id="panel" hidden><button id="logout">로그아웃</button><label>학급 <select id="classes"></select></label><label>테스트 학생 <select id="students"></select></label><button id="register">바코드 등록 모드</button> <button id="checkin">출결 스캔 모드</button> <button id="stop" disabled>카메라 종료</button><div id="reader"></div><small>등록 모드는 선택한 테스트 학생에게만 연결합니다. 출결 스캔은 서버 시간 기준입니다. 실제 학생 등록 금지.</small></section><section role="status" id="status">관리자 로그인 필요</section><a href="./admin-test.html">출결 관리 화면</a></main><script>
const SUPABASE_URL="https://iamefmxdcydltatykqvi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_vAcM08MB_92IZKLIgCwVvg_vjuZ11UD";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const el=id=>document.getElementById(id),show=t=>el("status").textContent=t;
let me=null,scanner=null,busy=false,active=false,mode="",last="",lastAt=0;
const option=(select,id,label)=>{const o=document.createElement("option");o.value=id;o.textContent=label;select.append(o);};
async function members(){el("students").replaceChildren();const id=el("classes").value;if(!id)return;const {data,error}=await db.from("class_members").select("user_id").eq("class_id",id).eq("member_role","student");if(error){show("학급 학생 조회 실패");return;}if(!data.length)return;const p=await db.from("profiles").select("id,display_name").in("id",data.map(x=>x.user_id)).eq("school_id",me.school_id).eq("role","student").eq("is_active",true);if(p.error){show("학생 조회 실패");return;}for(const x of p.data)option(el("students"),x.id,x.display_name||"학생");}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user)return;const p=await db.from("profiles").select("id,school_id,role,is_active,is_school_admin").eq("id",user.id).maybeSingle();if(p.error||!p.data?.is_active||!["teacher","admin"].includes(p.data.role)||!(p.data.is_school_admin||p.data.role==="admin")){show("학교 관리자 권한 필요");return;}me=p.data;const c=await db.from("classes").select("id,name").eq("school_id",me.school_id).order("name");if(c.error){show("학급 조회 실패");return;}el("classes").replaceChildren();for(const x of c.data)option(el("classes"),x.id,x.name);el("login").hidden=true;el("panel").hidden=false;await members();show(c.data.length?"학급을 선택하고 스캔 모드를 시작하세요.":"먼저 관리 화면에서 학급을 생성하세요.");}
el("loginForm").onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:el("email").value,password:el("password").value});el("password").value="";if(r.error){show("로그인 실패");return;}await init();};
el("classes").onchange=members;
async function stop(){active=false;if(scanner){try{await scanner.stop();}catch(e){}try{await scanner.clear();}catch(e){}scanner=null;}el("register").disabled=el("checkin").disabled=el("classes").disabled=el("students").disabled=false;el("stop").disabled=true;}
async function hash(value){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value))),x=>x.toString(16).padStart(2,"0")).join("");}
async function start(m){if(scanner||busy||!me)return;const cls=el("classes").value,student=el("students").value;if(!cls||(m==="register"&&!student)){show("학급과 테스트 학생을 선택하세요.");return;}if(m==="register"&&!confirm("선택한 테스트 학생에게 바코드를 연결할까요? 기존 연결은 자동으로 덮어쓰지 않습니다."))return;mode=m;last="";lastAt=0;el("register").disabled=el("checkin").disabled=el("classes").disabled=el("students").disabled=true;try{scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128],useBarCodeDetectorIfSupported:false});await scanner.start({facingMode:"environment"},{fps:15,aspectRatio:1.777778,disableFlip:false},async value=>{if(!active||busy||(value===last&&Date.now()-lastAt<5000))return;busy=true;last=value;lastAt=Date.now();try{const h=await hash(value);if(mode==="register"){const r=await db.from("student_barcodes").insert({student_id:student,school_id:me.school_id,barcode_hash:h});await stop();show(r.error?(r.error.code==="23505"?"이미 등록된 학생 또는 바코드입니다.":"등록 실패 · 관리자 권한 확인"):"바코드 등록 성공! 출결 스캔 모드를 시작하세요.");}else{const r=await db.rpc("barcode_check_in",{p_barcode_hash:h,p_class_id:cls});const labels={present:"출석 저장 완료",needs_review:"지각 · 확인 필요 기록 저장 완료",unknown_barcode:"미등록 바코드",invalid_class:"선택한 학급의 학생이 아닙니다",school_closed:"등교일 아님 · 저장하지 않음",missing_rules:"학교 규정 없음",already_checked_in:"이미 출결 기록이 있습니다"};show(r.error?"출결 저장 실패 · 서버 오류 코드: "+(r.error.code||"unknown"):(labels[r.data]||"예상하지 못한 응답"));}}catch(e){show("처리 실패 · 연결 확인");}finally{busy=false;}},()=>{});active=true;el("stop").disabled=false;show(m==="register"?"등록할 학생증을 비춰 주세요.":"출결 스캔 중 · 학생증을 비춰 주세요.");}catch(e){await stop();show("카메라 실행 실패 · 권한 확인");}}
el("register").onclick=()=>start("register");el("checkin").onclick=()=>start("checkin");el("stop").onclick=async()=>{await stop();show("카메라 종료");};el("logout").onclick=async()=>{await stop();await db.auth.signOut();location.reload();};window.addEventListener("pagehide",()=>{if(scanner)scanner.stop().catch(()=>{});});init();
</script></body></html>
