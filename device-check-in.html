<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTENDO | 출석 전용</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px system-ui}main{max-width:680px;margin:32px auto;padding:20px}section{background:white;border:1px solid #e6eaf1;border-radius:18px;padding:24px;margin:16px 0}h1{color:#4968e8}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #dfe5ef}input{width:100%;margin:10px 0}button{background:#4968e8;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5}#reader{width:100%;overflow:hidden}#status{font-size:20px;font-weight:600;min-height:60px}small{color:#718096}</style></head><body><main><h1>ATTENDO</h1><p>학교 입구 · 출석 전용</p><section><label for="token">기기 인증 토큰</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="start">스캔 시작</button><button id="stop" disabled>종료 및 토큰 지우기</button><p><small>토큰은 현재 페이지에서만 사용합니다. 새로고침하면 다시 입력해야 합니다.</small></p></section><section><h2>학생증을 스캔해 주세요</h2><div id="reader"></div><p id="status" role="status">기기 토큰을 입력하세요.</p></section></main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>const SUPABASE_URL="https://iamefmxdcydltatykqvi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_vAcM08MB_92IZKLIgCwVvg_vjuZ11UD";
const el=id=>document.getElementById(id);let scanner=null,token="",busy=false,last="",lastAt=0,generation=0;
async function hash(value){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,"0")).join("");}
async function stop(){generation++;token="";el("token").value="";const old=scanner;scanner=null;el("start").disabled=true;el("stop").disabled=true;try{if(old)await old.stop();}catch{}try{old?.clear();}catch{}el("start").disabled=false;el("token").disabled=false;el("status").textContent="스캔 종료";}
async function scan(raw){if(busy||!token||!scanner)return;const now=Date.now();if(raw===last&&now-lastAt<4000)return;last=raw;lastAt=now;busy=true;const g=generation;try{const barcode_hash=await hash(raw);if(g!==generation)return;const res=await fetch(SUPABASE_URL+"/functions/v1/device-check-in",{method:"POST",headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json","x-device-token":token},body:JSON.stringify({barcode_hash}),cache:"no-store"});const data=await res.json();if(g!==generation)return;if(res.status===401){await stop();el("status").textContent="기기 인증 실패. 관리자에게 문의하세요.";return;}el("status").textContent=data.message||data.error||"출석 처리 실패";}catch{if(g===generation)el("status").textContent="연결 오류. 다시 시도하세요.";}finally{busy=false;}}
el("start").onclick=async()=>{if(scanner||busy)return;const value=el("token").value.trim();if(!/^[0-9a-f]{64}$/.test(value)){el("status").textContent="기기 토큰을 확인하세요.";return;}token=value;el("token").value="";el("token").disabled=true;el("start").disabled=true;last="";lastAt=0;try{scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128],useBarCodeDetectorIfSupported:false});await scanner.start({facingMode:"environment"},{fps:15,aspectRatio:1.777778,disableFlip:false},scan,()=>{});el("stop").disabled=false;el("status").textContent="학생증을 스캔하세요. 첫 스캔에서 기기 인증을 확인합니다.";}catch{await stop();el("status").textContent="카메라 시작 실패. 카메라 권한을 확인하세요.";}};el("stop").onclick=stop;window.addEventListener("pagehide",()=>{token="";});
</script></body></html>
