<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTEND AI | Quagga2 스캐너 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:640px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e3e8f3;border-radius:20px;padding:22px}h1{font-size:23px}p{color:#607089;line-height:1.6}#view{position:relative;width:100%;min-height:240px;background:#172033;border-radius:14px;overflow:hidden;margin:16px 0}#view video{width:100%;height:auto;display:block}#view canvas{display:none}button{border:0;background:#4968e8;color:white;border-radius:10px;padding:13px 18px;font-size:15px;margin-right:8px}button:disabled{opacity:.5}.result{background:#eef1ff;border-radius:12px;padding:15px;margin:14px 0;line-height:1.7}a{color:#4968e8}</style><script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js" defer></script></head><body><main class="wrap"><section class="card"><h1>ATTEND AI · 새 인식 엔진 테스트</h1><p>기존 스캐너와 다른 Quagga2 인식 엔진으로 CODE_128 학생증을 테스트합니다. 출결 기록은 저장하지 않습니다.</p><div id="view"></div><button id="start">카메라 시작</button><button id="stop" disabled>종료</button><div class="result" role="status" aria-live="polite"><div id="status">카메라 시작을 눌러 주세요.</div><div id="stats">인식: 0회 · 첫 인식 시간: -</div></div><p>바코드 양끝 여백까지 화면에 들어오게 비추고, 조명 반사가 있으면 학생증을 조금 기울여 주세요.</p><p>바코드 번호와 영상은 화면에 표시하거나 서버에 저장하지 않습니다. 테스트 중 영상은 기기 안에서만 처리합니다.</p><p><a href="./scanner-test.html">기존 스캐너로 돌아가기</a></p></section></main><script>
(()=>{"use strict";const start=document.getElementById("start"),stop=document.getElementById("stop"),status=document.getElementById("status"),stats=document.getElementById("stats");let active=false,starting=false,count=0,started=0,lastValue="",lastSeen=0;const show=s=>status.textContent=s;
function shutdown(){active=false;starting=false;try{if(window.Quagga)Quagga.stop();}catch(e){}document.getElementById("view").replaceChildren();start.disabled=false;stop.disabled=true;}
start.addEventListener("click",()=>{if(active||starting)return;if(!window.Quagga){show("인식 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return;}starting=true;start.disabled=true;show("카메라 연결 중…");const config={inputStream:{name:"Live",type:"LiveStream",target:document.getElementById("view"),constraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},area:{top:"5%",right:"3%",left:"3%",bottom:"5%"}},locator:{patchSize:"medium",halfSample:false},numOfWorkers:0,frequency:12,decoder:{readers:["code_128_reader"]},locate:true};Quagga.init(config,err=>{if(err){shutdown();show("카메라 실행 실패: "+(err.name||"오류")+" · Safari 카메라 권한을 확인해 주세요.");return;}try{Quagga.start();active=true;starting=false;count=0;started=performance.now();lastValue="";lastSeen=0;stats.textContent="인식: 0회 · 첫 인식 시간: -";stop.disabled=false;show("CODE_128 분석 중…");}catch(e){shutdown();show("스캐너 시작 실패: "+(e.name||"오류"));}});});
if(window.Quagga){Quagga.onDetected(result=>{if(!active||!result?.codeResult?.code)return;const now=performance.now(),value=result.codeResult.code;if(value===lastValue&&now-lastSeen<3000)return;lastValue=value;lastSeen=now;count++;stats.textContent="인식: "+count+"회 · 인식 시간: "+((now-started)/1000).toFixed(1)+"초";started=now;show("✓ CODE_128 인식 성공! 다음 학생증을 비춰 주세요.");});}
else window.addEventListener("load",()=>{if(window.Quagga){Quagga.onDetected(result=>{if(!active||!result?.codeResult?.code)return;const now=performance.now(),value=result.codeResult.code;if(value===lastValue&&now-lastSeen<3000)return;lastValue=value;lastSeen=now;count++;stats.textContent="인식: "+count+"회 · 인식 시간: "+((now-started)/1000).toFixed(1)+"초";started=now;show("✓ CODE_128 인식 성공! 다음 학생증을 비춰 주세요.");});}});
stop.addEventListener("click",()=>{shutdown();show("카메라를 종료했습니다.");});window.addEventListener("pagehide",shutdown);
})();</script></body></html>
