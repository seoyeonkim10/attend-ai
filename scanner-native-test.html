<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTEND AI | 바코드 인식 엔진 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:640px;margin:25px auto;padding:0 16px}.card{background:white;border:1px solid #e3e8f3;border-radius:20px;padding:24px}h1{font-size:23px}p{color:#607089;line-height:1.6}video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#172033;border-radius:14px;margin:18px 0}button{border:0;background:#4968e8;color:white;border-radius:10px;padding:13px 18px;font-size:15px;margin-right:8px}button:disabled{opacity:.5}.result{background:#eef1ff;border-radius:12px;padding:15px;margin:14px 0;line-height:1.7}a{color:#4968e8}</style></head><body><main class="wrap"><section class="card"><h1>ATTEND AI · 다른 인식 엔진 테스트</h1><p>아이폰 브라우저가 지원하는 기본 바코드 인식 기능을 시험합니다. 기존 스캐너와 별개의 테스트이며, 출결 기록은 저장하지 않습니다.</p><video id="video" autoplay playsinline muted></video><button id="start">카메라 시작</button><button id="stop" disabled>종료</button><div class="result" role="status" aria-live="polite"><div id="status">지원 여부 확인 중…</div><div id="stats">성공: 0회 · 분석: 0회 · 인식 시간: -</div><div id="format">규격: -</div></div><p>바코드의 양끝과 흰 여백이 화면에 들어오도록 비춰 주세요. 빛이 반사되면 학생증을 조금 기울여 주세요.</p><p>개인정보 보호: 바코드 값은 화면에 표시하거나 서버로 전송하지 않습니다. 카메라 영상도 저장하지 않습니다.</p><p><a href="./scanner-test.html">기존 스캐너로 돌아가기</a></p></section></main>
<script>
(()=>{"use strict";
const video=document.getElementById("video"),start=document.getElementById("start"),stop=document.getElementById("stop"),status=document.getElementById("status"),stats=document.getElementById("stats"),format=document.getElementById("format");
let stream=null,detector=null,running=false,tries=0,hits=0,started=0,lastSeen=0,lastText="",busy=false,timer=null;
function show(s){status.textContent=s;}
function cleanup(){running=false;clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;start.disabled=false;stop.disabled=true;busy=false;}
async function support(){if(!("BarcodeDetector" in window)){show("이 브라우저는 기본 바코드 인식 기능을 지원하지 않습니다. 기존 스캐너를 이용해 주세요.");start.disabled=true;return false;}try{const formats=await BarcodeDetector.getSupportedFormats();if(!formats.includes("code_128")){show("기본 인식 기능이 CODE_128을 지원하지 않습니다.");start.disabled=true;return false;}detector=new BarcodeDetector({formats:["code_128"]});show("CODE_128 지원 확인! 카메라 시작을 눌러 주세요.");return true;}catch(e){show("기본 인식 기능을 사용할 수 없습니다. 기존 스캐너를 이용해 주세요.");start.disabled=true;return false;}}
async function scan(){if(!running)return;if(busy){timer=setTimeout(scan,120);return;}busy=true;try{if(video.readyState>=2){tries++;const results=await detector.detect(video);if(!running)return;if(results.length){const now=performance.now();const item=results.find(x=>x.format==="code_128");if(item&&!(item.rawValue===lastText&&now-lastSeen<3000)){hits++;lastText=item.rawValue;lastSeen=now;format.textContent="규격: CODE_128";show("✓ 인식 성공! 다음 학생증을 비춰 주세요. 출결 저장은 하지 않습니다.");stats.textContent="성공: "+hits+"회 · 분석: "+tries+"회 · 인식 시간: "+((now-started)/1000).toFixed(1)+"초";started=now;}}else if(tries%20===0){show("카메라 분석 중 ("+tries+"회) · 바코드 전체를 비춰 주세요.");}if(!results.length&&tries%20===0)stats.textContent="성공: "+hits+"회 · 분석: "+tries+"회 · 인식 시간: -";}}catch(e){show("인식 엔진 오류: "+(e.name||"알 수 없음")+" · 기존 스캐너와 비교해 주세요.");cleanup();return;}finally{busy=false;}if(running)timer=setTimeout(scan,120);}
start.addEventListener("click",async()=>{if(!detector)return;start.disabled=true;show("카메라 연결 중…");try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"}}});video.srcObject=stream;await video.play();running=true;tries=0;hits=0;lastText="";lastSeen=0;started=performance.now();stats.textContent="성공: 0회 · 분석: 0회 · 인식 시간: -";format.textContent="규격: -";stop.disabled=false;show("스캔 중…");scan();}catch(e){cleanup();show("카메라를 시작하지 못했습니다. Safari 카메라 권한을 확인해 주세요.");}});
stop.addEventListener("click",()=>{cleanup();show("카메라를 종료했습니다.");});window.addEventListener("pagehide",cleanup);support();
})();
</script></body></html>
