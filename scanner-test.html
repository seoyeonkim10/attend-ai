<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>ATTEND AI | 바코드 스캔 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:660px;margin:30px auto;padding:0 16px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.logo{background:#263b78;color:white;font-size:26px;font-weight:900;border-radius:16px;width:57px;height:57px;display:grid;place-items:center}.brand strong{font-size:21px}.brand small{display:block;color:#8b99b3;letter-spacing:2px;font-size:10px;margin-top:3px}.card{background:#fff;border:1px solid #e3e8f3;border-radius:22px;padding:clamp(18px,5vw,32px);box-shadow:0 15px 45px #2034570c}.tag{font-size:11px;color:#4968e8;letter-spacing:1.5px;font-weight:800}h1{font-size:25px;margin:10px 0 7px}p{color:#718096;line-height:1.7;font-size:14px}.camera{position:relative;aspect-ratio:4/3;background:#172033;border-radius:16px;overflow:hidden;margin:22px 0 14px;display:grid;place-items:center;color:#dce4f8}video{width:100%;height:100%;object-fit:cover;display:none}.frame{position:absolute;width:70%;height:35%;border:2px solid #b4c6ff;border-radius:13px;pointer-events:none;box-shadow:0 0 0 200px #101c3440}.camera.idle .frame{display:none}.camera span{padding:20px;text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:13px 18px;font-size:14px;font-weight:750;cursor:pointer;background:#4968e8;color:white}button.secondary{background:#edf1fa;color:#263b78}button:disabled{opacity:.5;cursor:not-allowed}.result{border-radius:13px;background:#f5f7fc;padding:17px;margin-top:16px}.result strong{display:block;font-size:13px;margin-bottom:8px}.result p{margin:0;word-break:break-all}.notice{font-size:12px;color:#8a681f;background:#fff8e8;padding:13px;border-radius:10px;margin-top:16px}.links{margin-top:18px;font-size:13px}a{color:#4968e8}</style></head>
<body><main class="wrap"><div class="brand"><div class="logo">A</div><div><strong>ATTEND AI</strong><small>SMART ATTENDANCE</small></div></div><section class="card"><div class="tag">CHECK-IN · CAMERA TEST</div><h1>학생증 바코드 스캔</h1><p>휴대폰 또는 태블릿의 카메라로 학생증 바코드를 인식하는 테스트 화면입니다.</p><div class="camera idle" id="camera"><span id="placeholder">카메라 시작 버튼을 눌러 주세요.</span><video id="video" autoplay muted playsinline></video><div class="frame"></div></div><div class="actions"><button id="start">카메라 시작</button><button id="stop" class="secondary" disabled>카메라 종료</button></div><div class="result" role="status" aria-live="polite"><strong>인식 상태</strong><p id="message">아직 스캔하지 않았습니다.</p></div><div class="notice">현재는 카메라 인식 테스트만 가능합니다. 학생 번호나 바코드 원문을 화면에 표시하거나 서버에 저장하지 않습니다. 실제 출결 자동 기록은 학교 승인 기기 인증 및 서버 권한 검증을 구현한 뒤 연결합니다.</div><div class="links"><a href="./admin-test.html">출결 조회 사이트로 돌아가기</a></div></section></main>
<script>
(()=>{const video=document.getElementById("video"),box=document.getElementById("camera"),msg=document.getElementById("message"),start=document.getElementById("start"),stop=document.getElementById("stop"),placeholder=document.getElementById("placeholder");let stream=null,detector=null,active=false,frame=0,busy=false,last=0;
function close(){active=false;cancelAnimationFrame(frame);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;video.style.display="none";placeholder.style.display="block";box.classList.add("idle");start.disabled=false;stop.disabled=true;}
async function scan(){if(!active)return;const now=performance.now();if(!busy&&now-last>220&&video.readyState>=2){busy=true;last=now;try{const codes=await detector.detect(video);if(codes.length){msg.textContent="바코드 인식 성공! 실제 출결 저장은 아직 연결되지 않았습니다.";close();return;}}catch(e){msg.textContent="스캔 중 문제가 발생했습니다. 카메라를 다시 시작해 주세요.";close();return;}finally{busy=false;}}frame=requestAnimationFrame(scan);}
start.addEventListener("click",async()=>{if(!navigator.mediaDevices?.getUserMedia){msg.textContent="이 브라우저에서 카메라를 사용할 수 없습니다.";return;}if(!("BarcodeDetector" in window)){msg.textContent="이 브라우저는 바코드 인식을 지원하지 않습니다. 최신 Chrome 등 지원 브라우저에서 다시 시도해 주세요.";return;}start.disabled=true;msg.textContent="카메라 연결 중...";try{detector=new BarcodeDetector({formats:["code_128","code_39","ean_13","ean_8","itf","codabar","upc_a","upc_e"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;await video.play();video.style.display="block";placeholder.style.display="none";box.classList.remove("idle");stop.disabled=false;active=true;msg.textContent="바코드를 사각형 안에 맞춰 주세요.";scan();}catch(e){close();msg.textContent="카메라를 열지 못했습니다. 카메라 권한과 브라우저 지원 여부를 확인해 주세요.";}});stop.addEventListener("click",()=>{close();msg.textContent="카메라가 종료되었습니다.";});window.addEventListener("pagehide",close);})();
</script></body></html>
